project_name: "timeful"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["All acceptance criteria are satisfied", "All required unit tests pass. Documentation-only changes are exempt unless the user requests unit tests", "All required e2e tests pass. Documentation-only changes are exempt unless the user requests e2e tests", "Changed Markdown files are formatted with npm run format:markdown"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: true
check_active_branches: true
active_branch_days: 365
task_prefix: "TASK"
