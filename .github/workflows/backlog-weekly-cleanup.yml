name: Backlog Weekly Cleanup

on:
  schedule:
    # Every Sunday at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: backlog-weekly-cleanup
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  complete-done-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The flake pins the Backlog CLI to a commit two commits ahead of the
      # published v1.52.0, and neither commit changes `task complete`.
      - name: Install the Backlog CLI
        run: npm install --global --no-audit --no-fund backlog.md@1.52.0

      - name: Collect Done tasks
        id: collect
        run: |
          set -euo pipefail
          done_ids="$RUNNER_TEMP/done-task-ids.txt"
          backlog task list --status Done --json | jq -r '.tasks[].id' > "$done_ids"
          count=$(wc -l < "$done_ids" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Move Done tasks to completed
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          while IFS= read -r task_id; do
            backlog task complete "$task_id"
          done < "$RUNNER_TEMP/done-task-ids.txt"

      - name: Configure git
        if: steps.collect.outputs.count != '0'
        env:
          # Pull requests opened with the repository GITHUB_TOKEN do not start
          # pull-request workflows, so a BACKLOG_CLEANUP_TOKEN secret lets CI
          # run on generated cleanup pull requests when one is configured.
          GH_TOKEN: ${{ secrets.BACKLOG_CLEANUP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit the cleanup
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          branch="chore/backlog-weekly-completed"
          task_ids=$(paste -sd, "$RUNNER_TEMP/done-task-ids.txt" | sed 's/,/, /g')
          git checkout -b "$branch"
          git add backlog
          git commit -m "chore(backlog): move done tasks to completed" \
            -m "Move ${task_ids} from backlog/tasks/ to backlog/completed/ so the active task list only tracks open work. The Backlog CLI changes only the file location; task contents are unchanged."

      - name: Push the cleanup branch
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.BACKLOG_CLEANUP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          branch="chore/backlog-weekly-completed"
          # The branch belongs to this workflow, so force-with-lease refreshes
          # an unmerged cleanup pull request instead of failing or opening an
          # overlapping one. Fetch first so the lease has a remote-tracking ref
          # to compare against.
          git fetch --quiet origin "$branch" || true
          git push --quiet --force-with-lease origin "$branch"

      - name: Open or refresh the cleanup pull request
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.BACKLOG_CLEANUP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          branch="chore/backlog-weekly-completed"
          task_ids=$(paste -sd, "$RUNNER_TEMP/done-task-ids.txt" | sed 's/,/, /g')
          body="$RUNNER_TEMP/cleanup-pr-body.md"
          cat > "$body" <<EOF
          ## Summary

          Move tasks in the terminal Done status from \`backlog/tasks/\` to \`backlog/completed/\` so the active task list only tracks open work.
          Generated by the scheduled \`Backlog Weekly Cleanup\` workflow.

          ## Changes

          - Move ${task_ids} to \`backlog/completed/\` with \`backlog task complete\`; the records keep their contents and change location only.

          ## Backlog tasks

          Already-Done records moved by this cleanup: ${task_ids}.

          ## PR Definition of Done

          - [x] This pull request follows the Pull Request Preparation policy in \`BACKLOG_WORKFLOW.md\`; it marks no task Done and performs only the periodic cleanup step.

          ## Validation

          - Local runs: not applicable; this pull request only relocates Backlog task records.
          - Not run / not covered (reason): not applicable.

          ## Reviewer notes

          This pull request was generated by \`.github/workflows/backlog-weekly-cleanup.yml\`.
          When the workflow runs with the repository \`GITHUB_TOKEN\`, GitHub does not start pull-request workflows for it; configure a \`BACKLOG_CLEANUP_TOKEN\` secret to have CI run on generated cleanup pull requests.
          EOF
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$body"
            echo "Refreshed pull request #$number for $branch."
          else
            gh pr create --base main --head "$branch" --title "chore(backlog): move done tasks to completed" --body-file "$body"
          fi
